<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Producto</title>
</head>
<body>
    <h1>Agregar un nuevo producto</h1>
    
    <!-- El formulario usa th:object para enlazar con el DTO -->
    <form th:action="@{/guardar}" th:object="${producto}" method="post">
        <label>Nombre: 
            <input type="text" th:field="*{nombre}" required>
        </label><br><br>
        
        <label>Precio: 
            <input type="number" step="0.01" th:field="*{precio}" required>
        </label><br><br>
        
        <label>Categoría: 
            <input type="text" th:field="*{categoria}" required>
        </label><br><br>
        
        <button type="submit">Guardar Producto</button>
    </form>
    
    <br>
    <a th:href="@{/productos}">Volver a la lista</a>
</body>
</html>
