<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle del Producto</title>
</head>
<body>
    <h1>Detalles del Producto</h1>
    
    <div th:if="${producto != null}">
        <p><strong>Nombre:</strong> <span th:text="${producto.nombre}"></span></p>
        <p><strong>Precio:</strong> $<span th:text="${producto.precio}"></span></p>
        <p><strong>Categoría:</strong> <span th:text="${producto.categoria}"></span></p>
    </div>
    <div th:if="${producto == null}">
        <p>Producto no encontrado.</p>
    </div>
    
    <br>
    <a th:href="@{/productos}">Volver a la lista</a>
</body>
</html>
